[project]
name = "bzr-group-case"
version = "0.1.0"
description = "Conciliação e limpeza de precatórios"
authors = [
    { name = "Abner Cerqueira", email = "abner.cerqueira@fatec.sp.gov.br" }
]
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.basedpyright]
pythonVersion = "3.10"
typeCheckingMode = "standard"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
